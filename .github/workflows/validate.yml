name: Validate

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "dependencies.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
  pull_request:
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "dependencies.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Generate resources
        env:
          REGISTRYLIBDEMO_FAST_RUN: 'true'
        run: |
          chmod +x gradlew
          ./gradlew runClientData --no-daemon --build-cache
      - name: Verify checks and GameTests
        env:
          REGISTRYLIBDEMO_FAST_RUN: 'true'
        run: |
          chmod +x gradlew
          ./gradlew check runGameTestServer --no-daemon --build-cache
