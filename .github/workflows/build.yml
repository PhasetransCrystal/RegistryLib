name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm publishing'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Branch restrictions and required reviewers are configured in the repository's
    # "release" environment; branch names are not hardcoded here.
    if: inputs.confirm == 'release'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_BUILD: 'true'
      REGISTRYLIBTEST_FAST_RUN: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Generate data, verify, build, and publish
        run: |
          chmod +x gradlew
          ./gradlew clean runData build publish --no-daemon --build-cache
        env:
          ORG_GRADLE_PROJECT_ptcrysUsername: ${{ secrets.PTCRYS_USERNAME }}
          ORG_GRADLE_PROJECT_ptcrysPassword: ${{ secrets.PTCRYS_PASSWORD }}
      - name: Get version
        id: version
        run: |
          VERSION=$(./gradlew -q properties --no-daemon 2>/dev/null | grep '^version:' | awk '{print $2}')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
