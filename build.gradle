plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    alias libs.plugins.modDevGradleLegacy
    alias libs.plugins.kotlinDevGradleLegacy
    alias libs.plugins.lombokLegacy
    alias libs.plugins.kotlinLombokLegacy
    alias libs.plugins.spotless
}

allprojects {
    group = 'net.ptcrys'
}

def buildDate = new Date()
def year = String.format('%ty', buildDate)
// 本地开发使用周快照版: 26.16-SNAPSHOT; release使用日期版: 26.8.11
def isRelease = System.getenv('RELEASE_BUILD') == 'true'
def dynamicVersion
if (isRelease) {
    dynamicVersion = "${year}.${buildDate.month + 1}.${buildDate.date}"
} else {
    def calendar = Calendar.getInstance()
    def weekOfYear = calendar.get(Calendar.WEEK_OF_YEAR)
    dynamicVersion = "${year}.${weekOfYear}-SNAPSHOT"
}
ext.mod_version = dynamicVersion
version = dynamicVersion
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

apply from: "$projectDir/dependencies.gradle"
apply from: "$projectDir/gradle/scripts/repositories.gradle"
apply from: "$projectDir/gradle/scripts/spotless.gradle"

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},registrylibtest"
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},registrylibtest"
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},registrylibtest"
        }

        data {
            type = 'clientData'
            programArguments.addAll '--mod', project.mod_id,
                    '--mod', 'registrylibtest',
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources/registrylib'
    srcDir 'src/generated/resources/registrylibtest'
}

def releaseModsToml = layout.buildDirectory.file('generated/releaseResources/META-INF/neoforge.mods.toml')

tasks.register('generateReleaseModsToml') {
    group = 'build'
    description = 'Generates the library-only NeoForge metadata for published jars.'
    outputs.file(releaseModsToml)
    inputs.properties([
            mod_id                 : mod_id,
            mod_version            : mod_version,
            mod_name               : mod_name,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_license            : mod_license,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
    ])

    doLast {
        def outputFile = releaseModsToml.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText("""modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
""", 'UTF-8')
    }
}

jar {
    dependsOn(tasks.named('generateReleaseModsToml'))

    exclude 'META-INF/neoforge.mods.toml'
    exclude 'net/ptcrys/registrylibtest/**'
    exclude 'registrylibtest/**'
    exclude 'assets/registrylibtest/**'
    exclude 'data/registrylibtest/**'
    exclude 'data/minecraft/tags/**'
    exclude '.cache/**'

    from(releaseModsToml) {
        into 'META-INF'
    }
}

def mainLibrarySources = fileTree('src/main/java/com/ptcrys/registrylib') {
    include '**/*.java'
}

tasks.register('verifyNoRegistryLibTestLeaks') {
    group = 'verification'
    description = 'Fails the build if main library sources depend on registrylibtest classes that are excluded from the published jar.'
    inputs.files(mainLibrarySources)

    doLast {
        def offendingFiles = mainLibrarySources.files.findAll {
            it.getText('UTF-8').contains('net.ptcrys.registrylibtest')
        }

        if (!offendingFiles.isEmpty()) {
            def formattedPaths = offendingFiles.collect {
                project.relativePath(it).replace('\\', '/')
            }
            throw new GradleException(
                    'Main library sources cannot depend on net.ptcrys.registrylibtest because that package is excluded from the published jar:\n - '
                            + formattedPaths.join('\n - '))
        }
    }
}

tasks.named('compileJava') {
    dependsOn(tasks.named('verifyNoRegistryLibTestLeaks'))
}

tasks.register('verifyReleaseJarDoesNotContainRegistryLibTest') {
    group = 'verification'
    description = 'Fails the build if the published jar contains registrylibtest classes, metadata, or generated resources.'
    dependsOn(tasks.named('jar'))

    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def forbiddenEntries = []

        zipTree(jarFile).matching {
            include 'net/ptcrys/registrylibtest/**'
            include 'registrylibtest/**'
            include 'assets/registrylibtest/**'
            include 'data/registrylibtest/**'
            include 'data/minecraft/tags/**'
        }.visit { details ->
            if (!details.directory) {
                forbiddenEntries.add(details.relativePath.pathString)
            }
        }

        def modsToml = zipTree(jarFile).matching {
            include 'META-INF/neoforge.mods.toml'
        }.singleFile

        if (modsToml.getText('UTF-8').contains('registrylibtest')) {
            forbiddenEntries.add('META-INF/neoforge.mods.toml contains registrylibtest')
        }

        if (!forbiddenEntries.isEmpty()) {
            throw new GradleException(
                    'Release jar must not contain registrylibtest content:\n - '
                            + forbiddenEntries.sort().join('\n - '))
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('verifyReleaseJarDoesNotContainRegistryLibTest'))
}

test {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    suppressedValidationErrors.add('dependencies-without-versions')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (isRelease) {
            maven {
                name = "PtcrysReleases"
                url = uri("https://maven.ptcrys.net/releases")
                credentials {
                    username = project.findProperty('ptcrysUsername')
                    password = project.findProperty('ptcrysPassword')
                }
            }
        } else {
            maven {
                name = "PtcrysSnapshots"
                url = uri("https://maven.ptcrys.net/snapshots")
                credentials {
                    username = project.findProperty('ptcrysUsername')
                    password = project.findProperty('ptcrysPassword')
                }
            }
        }
    }
}
