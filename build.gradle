plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    alias libs.plugins.modDevGradleLegacy
    alias libs.plugins.kotlinDevGradleLegacy
    alias libs.plugins.lombokLegacy
    alias libs.plugins.kotlinLombokLegacy
    alias libs.plugins.spotless
}

allprojects {
    group = 'net.ptcrys'
}

def buildDate = new Date()
def dynamicVersion = "${String.format('%ty', buildDate)}.${buildDate.month + 1}.${buildDate.date}"
ext.mod_version = dynamicVersion
version = dynamicVersion
group = mod_group_id

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.named('compileJava') {
    dependsOn(tasks.named('verifyNoRegistryLibTestLeaks'))
}
tasks.named('check') {
    dependsOn(tasks.named('verifyReleaseJarDoesNotContainRegistryLibTest'))
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 包含数据生成器生成的资源.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.kotlin { srcDir("src/main/java") }

apply from: "$projectDir/gradle/scripts/moddevgradle.gradle"
apply from: "$projectDir/dependencies.gradle"
apply from: "$projectDir/gradle/scripts/resources.gradle"
apply from: "$projectDir/gradle/scripts/jars.gradle"
apply from: "$projectDir/gradle/scripts/repositories.gradle"
apply from: "$projectDir/gradle/scripts/spotless.gradle"

generateModMetadata.doFirst {
    mkdir('run/client')
    mkdir('run/server')
    mkdir('run/clientData')
    mkdir('run/serverData')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-removal"
}

configurations {
    libraries
    api.extendsFrom libraries

    localImplementation
    runtimeClasspath.extendsFrom localImplementation
    compileOnly.extendsFrom localImplementation
}


def releaseModsToml = layout.buildDirectory.file('generated/releaseResources/META-INF/neoforge.mods.toml')

tasks.register('generateReleaseModsToml') {
    group = 'build'
    description = 'Generates the library-only NeoForge metadata for published jars.'
    outputs.file(releaseModsToml)
    inputs.properties([
            mod_id                 : mod_id,
            mod_version            : mod_version,
            mod_name               : mod_name,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_license            : mod_license,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
    ])

    doLast {
        def outputFile = releaseModsToml.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText("""modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
""", 'UTF-8')
    }
}

jar {
    dependsOn(tasks.named('generateReleaseModsToml'))

    exclude 'META-INF/neoforge.mods.toml'
    exclude 'net/ptcrys/registrylibtest/**'
    exclude 'registrylibtest/**'
    exclude 'assets/registrylibtest/**'
    exclude 'data/registrylibtest/**'
    exclude 'data/minecraft/tags/**'
    exclude '.cache/**'

    from(releaseModsToml) {
        into 'META-INF'
    }
}

java {
    withSourcesJar()
}

//dependsOn(tasks.named('verifyReleaseJarDoesNotContainRegistryLibTest'))
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "PtcrysReleases"
            url = uri("https://maven.ptcrys.net/releases")
            credentials {
                username = project.findProperty('ptcrysUsername')
                password = project.findProperty('ptcrysPassword')
            }
        }
    }
}

// IDEA不再自动下载依赖项的源码/javadoc jar，因此需要显式启用此行为。
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}